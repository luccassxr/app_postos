name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare official WK assets
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import io
          from PIL import Image

          src = Path('assets/wk_logo_fixed.b64')
          if not src.exists():
              raise SystemExit('assets/wk_logo_fixed.b64 not found')

          raw = src.read_text(encoding='ascii').strip()
          try:
              data = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit(f'Validated WK logo payload could not be decoded: {exc}')

          try:
              logo = Image.open(io.BytesIO(data)).convert('RGBA')
              logo.load()
          except Exception as exc:
              raise SystemExit(f'WK logo payload is not a valid image: {exc}')

          alpha = logo.getchannel('A')
          bbox = alpha.getbbox()
          if bbox:
              logo = logo.crop(bbox)

          logo.save('assets/wk_logo.webp', 'WEBP', quality=94, method=6)

          canvas = Image.new('RGBA', (1024, 1024), '#020712')
          mark = logo.copy()
          mark.thumbnail((820, 820), Image.Resampling.LANCZOS)
          x = (1024 - mark.width) // 2
          y = (1024 - mark.height) // 2
          canvas.alpha_composite(mark, (x, y))
          canvas.convert('RGB').save('assets/wk_app_icon.png', 'PNG', optimize=True)

          Image.open('assets/wk_logo.webp').verify()
          Image.open('assets/wk_app_icon.png').verify()
          print('WK assets validated and generated successfully')
          PY
          file assets/wk_logo.webp assets/wk_app_icon.png
          ls -lh assets/wk_logo.webp assets/wk_app_icon.png

      - name: Generate Android project
        run: flutter create . --platforms=android --org com.grupowk --project-name app_postos

      - name: Set app name
        run: sed -i 's/android:label="app_postos"/android:label="WK Cliente"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wk-cliente-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
