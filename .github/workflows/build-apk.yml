name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare official WK assets
        run: |
          set -euo pipefail
          test -s assets/wk_logo.b64
          base64 --decode assets/wk_logo.b64 > assets/wk_logo.png

          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path('assets/wk_logo.png')
          image = Image.open(source).convert('RGBA')
          image.load()

          # Remove transparent margins so the WK logo is visible at the intended size.
          alpha = image.getchannel('A')
          bbox = alpha.getbbox()
          if bbox:
              image = image.crop(bbox)
          image.save(source, 'PNG', optimize=True)

          # Launcher icon: dark WK background + official artwork centered.
          canvas = Image.new('RGBA', (1024, 1024), (2, 7, 18, 255))
          mark = image.copy()
          mark.thumbnail((820, 820), Image.Resampling.LANCZOS)
          x = (1024 - mark.width) // 2
          y = (1024 - mark.height) // 2
          canvas.alpha_composite(mark, (x, y))
          canvas.convert('RGB').save('assets/wk_app_icon.png', 'PNG', optimize=True)

          # Re-open generated files so CI fails here if either image is invalid.
          Image.open('assets/wk_logo.png').verify()
          Image.open('assets/wk_app_icon.png').verify()
          print('WK assets generated successfully')
          PY

          file assets/wk_logo.png assets/wk_app_icon.png
          ls -lh assets/wk_logo.png assets/wk_app_icon.png

      - name: Point Flutter to PNG logo
        run: |
          sed -i 's#assets/wk_logo.webp#assets/wk_logo.png#g' pubspec.yaml
          sed -i 's#assets/wk_logo.webp#assets/wk_logo.png#g' lib/main.dart
          grep -n "wk_logo" pubspec.yaml lib/main.dart

      - name: Generate Android project
        run: flutter create . --platforms=android --org com.grupowk --project-name app_postos

      - name: Set app name
        run: sed -i 's/android:label="app_postos"/android:label="WK Cliente"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wk-cliente-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
