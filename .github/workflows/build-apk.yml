name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --platforms=android --org com.grupowk --project-name app_postos
      - name: Set Grupo WK display name
        run: |
          sed -i 's/android:label="app_postos"/android:label="Grupo WK"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/WK Cliente/Grupo WK/g' lib/main.dart
      - name: Apply compact customer home layout
        run: python3 tool/compact_customer_home.py
      - name: Use uploaded home banner
        run: python3 tool/use_home_banner.py
      - name: Apply final home refinements
        run: python3 tool/refine_home_details.py
      - name: Apply dynamic points card
        run: python3 tool/use_points_card.py
      - name: Redesign benefits and coupons screen
        run: python3 tool/redesign_benefits_screen.py
      - name: Apply final UI polish
        run: python3 tool/polish_ui.py
      - name: Final Home cleanup
        run: python3 tool/final_home_cleanup.py
      - name: Polish action messages
        run: python3 tool/polish_action_messages.py
      - name: Get dependencies
        run: flutter pub get
      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grupo-wk-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
