name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate WK logo asset
        run: |
          test -f assets/wk_logo.webp
          ls -lh assets/wk_logo.webp

      - name: Prepare WK assets
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          logo_path = Path('assets/wk_logo.webp')
          logo = Image.open(logo_path).convert('RGBA')

          # Re-encode the source asset to guarantee a valid, Flutter-readable WebP.
          logo.save(logo_path, 'WEBP', quality=96, method=6)

          # Build a square launcher icon using the same official WK artwork.
          canvas = Image.new('RGBA', (1024, 1024), '#020712')
          mark = logo.copy()
          mark.thumbnail((860, 860), Image.Resampling.LANCZOS)
          x = (1024 - mark.width) // 2
          y = (1024 - mark.height) // 2
          canvas.alpha_composite(mark, (x, y))
          canvas.convert('RGB').save('assets/wk_app_icon.png', 'PNG', optimize=True)

          print('logo:', logo.size, 'icon:', canvas.size)
          PY
          file assets/wk_logo.webp assets/wk_app_icon.png
          ls -lh assets/wk_logo.webp assets/wk_app_icon.png

      - name: Generate Android project
        run: flutter create . --platforms=android --org com.grupowk --project-name app_postos

      - name: Set app name
        run: sed -i 's/android:label="app_postos"/android:label="WK Cliente"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wk-cliente-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
